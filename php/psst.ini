; PSST upload limits.
; PHP defaults (upload_max_filesize=2M, post_max_size=8M) are far below the app's
; configured max_upload_bytes, so anything larger than 2 MB — typical for photos and
; videos picked on a phone — was silently discarded by PHP before the app saw it.
; Keep post_max_size above upload_max_filesize to leave room for multipart overhead.
upload_max_filesize = 128M
post_max_size = 136M
max_file_uploads = 20

; Slow mobile connections need time to finish the transfer.
max_input_time = 600
max_execution_time = 600

; Uploads stream to a temp file, so this only covers normal request handling.
memory_limit = 256M

; Never leak warnings/notices into JSON or upload responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
